services:
  bgf-site:
    build: .
    container_name: bgf-site
    ports:
      - "3011:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      BGF_DB: /data/survey.db
      # Both come from the local .env file (git-ignored). BGF_ADMIN_PASSWORD
      # gates /admin with HTTP Basic auth; empty leaves it open.
      BGF_SECRET: ${BGF_SECRET}
      BGF_ADMIN_PASSWORD: ${BGF_ADMIN_PASSWORD}
    volumes:
      # SQLite DB is stored in ./data on the host so it survives rebuilds.
      - ./data:/data
      # PDF/HTML generated by generate_pdf.py land here on the host.
      - ./output:/app/output
    restart: unless-stopped
